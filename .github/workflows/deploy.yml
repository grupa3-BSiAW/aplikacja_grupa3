name: Build and deploy to Azure
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
env:
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/czat
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
 
      - name: Zaloguj do Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: Zainstaluj Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Skompiluj aplikacje
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/czat .
 
      - name: Zaloguj do ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"
 
      - name: Zbuduj i wypchnij obraz
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
 
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Zaloguj do Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Wdroz obraz na Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
 